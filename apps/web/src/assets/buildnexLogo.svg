<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bnTop" x1="15" y1="20" x2="85" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bnLeft" x1="15" y1="35" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="bnRight" x1="50" y1="35" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bnAccent" x1="40" y1="10" x2="60" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Isometric Building Block Tier 1 (Base) -->
  <!-- Top Face -->
  <polygon points="50,14 84,33 50,52 16,33" fill="url(#bnTop)" />
  <!-- Left Face (B pillar) -->
  <polygon points="16,33 50,52 50,86 16,67" fill="url(#bnLeft)" />
  <!-- Right Face (N facet) -->
  <polygon points="50,52 84,33 84,67 50,86" fill="url(#bnRight)" />

  <!-- Futuristic Stepped Cutout forming "N" & "B" Architecture -->
  <polygon points="50,52 68,42 68,62 50,72" fill="#38bdf8" opacity="0.85" />
  <polygon points="32,42 50,52 50,72 32,62" fill="#60a5fa" opacity="0.4" />
  
  <!-- Modern Geometric Window Lines -->
  <line x1="28" y1="44" x2="28" y2="58" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  <line x1="38" y1="50" x2="38" y2="64" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  <line x1="72" y1="44" x2="72" y2="58" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" />
  <line x1="62" y1="50" x2="62" y2="64" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" />

  <!-- Construction Apex Beacon (Gold Accent) -->
  <polygon points="50,6 56,14 50,22 44,14" fill="url(#bnAccent)" />
</svg>
